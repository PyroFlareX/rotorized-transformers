[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotor-transformer"
version = "0.1.0"
description = "Research code: structured Givens-rotor / diagonal-scaling representations of pretrained Transformer weights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  # Qwen3.5 (qwen3_5) model classes; 5.19.0 is the version verified in this repo.
  "transformers>=5.19",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rotor" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running numerical tests",
  "network: requires Hugging Face Hub network access (metadata only, never weights)",
  "nas: requires the NAS model root to be mounted",
  "cxx: requires a C++17 compiler",
]
addopts = "-m 'not network and not nas'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
