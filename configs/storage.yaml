# Every script resolves paths through rotor.storage; never hardcode these elsewhere.
#
# MANDATORY: all base and derived checkpoints live under this NAS root.
# Override per machine with configs/storage.local.yaml (gitignored) or ROTOR_STORAGE_CONFIG.
version: 1
nas_root: /mnt/NAS/MediaHome/Local-Models/
